name: Release

# Signed release on a v* tag. Same shape as vela-build's signing workflow.
# Needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set in this repository — cannot sign."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HERMES_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build signed release
        env:
          HERMES_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HERMES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HERMES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          ./gradlew :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "out/hermes-${VERSION}.apk"
          cd out && for f in *.apk; do sha256sum "$f" > "$f.sha256"; done && cat *.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          SIGNER=$("$APKSIGNER" verify --print-certs out/*.apk | grep -i 'sha-256 digest' | head -1 | awk -F': ' '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f' | cut -c1-8)
          TESTS=$(find app/build/test-results/testDebugUnitTest -name '*.xml' -print0 | xargs -0 grep -ho 'tests="[0-9]*"' | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
          {
            echo "Hermes ${TAG} — signed build."
            echo ""
            echo "- unit tests: ${TESTS}"
            echo "- signer: ${SIGNER} (certificate SHA-256 prefix — pin this in AppCatalog)"
            echo ""
            for f in out/*.apk.sha256; do
              echo "- \`$(basename "$f" .sha256)\`: \`$(awk '{print $1}' "$f")\`"
            done
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" out/* --title "Hermes ${TAG}" --notes-file "$RUNNER_TEMP/notes.md" || \
            { gh release upload "$TAG" out/* --clobber; gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"; }
